# Starts the whole project with one command:
#
#     docker compose up --build
#
# Then open http://localhost:8080
#
# Before the first run, sign in to Gmail once on your own computer
# (python gmail_login.py) so that credentials/token.json exists.

services:
  backend:
    build: .
    # Secrets come from .env at start-up. They are never baked into the image.
    env_file: .env
    environment:
      GMAIL_CREDENTIALS_PATH: credentials/credentials.json
      GMAIL_TOKEN_PATH: credentials/token.json
    volumes:
      # The Gmail login files live on your computer and are shared in.
      # Not read-only: the backend rewrites token.json when it renews the login.
      - ./credentials:/app/credentials
    restart: unless-stopped
    # No ports are opened here on purpose: the backend can only be reached
    # through the dashboard's web server.

  dashboard:
    build: ./dashboard
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
